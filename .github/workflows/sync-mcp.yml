name: Sync MCP Server

on:
  push:
    branches: [main]
    paths:
      - "mcp-server/**"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Clone or init target repo
        env:
          TOKEN: ${{ secrets.MCP_REPO_TOKEN }}
        run: |
          if git ls-remote --exit-code "https://x-access-token:${TOKEN}@github.com/bikerlfh/toony-mcp.git" HEAD >/dev/null 2>&1; then
            git clone "https://x-access-token:${TOKEN}@github.com/bikerlfh/toony-mcp.git" _target
          else
            mkdir _target && cd _target && git init -b main
            git remote add origin "https://x-access-token:${TOKEN}@github.com/bikerlfh/toony-mcp.git"
          fi

      - name: Sync files
        run: |
          # Remove old files from target (except .git)
          find _target -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          # Copy mcp-server contents to target root
          cp -a mcp-server/. _target/

      - name: Commit and push
        working-directory: _target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to sync"
            exit 0
          fi
          git commit -m "sync: update from toony-dev-core@${GITHUB_SHA::7}"
          git push -u origin main
