[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.base"
pythonpath = ["apps"]
python_files = ["tests/test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["apps/accounts", "apps/organizations", "apps/projects", "apps/common"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0

# ── Ruff ────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 79
exclude = ["migrations", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B904",
]

[tool.ruff.lint.isort]
known-first-party = [
    "accounts", "organizations", "projects", "agents",
    "workflows", "importers", "common", "config",
    "toony_agents", "workspace",
]

[tool.ruff.format]
quote-style = "double"
