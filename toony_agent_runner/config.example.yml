backend_url: "ws://localhost:8080/ws/toony-agents/runner/"
api_key: "tok_ta_YOUR_KEY_HERE"

# Base directory for all org workspaces.
# Each organization gets a subdirectory: {workspace_root}/{org_slug}/
# If multiple runners share the same machine, use different workspace_root values.
workspace_root: "~/work"

# Protocol for cloning repositories: ssh | https (default: ssh)
# ssh uses git@host:owner/repo.git, https uses https://host/owner/repo.git
clone_protocol: "ssh"

claude:
  working_directory: "."
  max_task_timeout: 3600
  approval_timeout: 600
  max_concurrent_tasks: 1    # max Claude tasks running simultaneously (default: 1)
  # oauth_token: ""  # or set CLAUDE_CODE_OAUTH_TOKEN env var
  permission_mode: "acceptEdits" # bypassPermissions
  # allowed_tools:
  #   - Read
  #   - Edit
  #   - Write
  #   - Bash
  #   - Grep
  #   - Glob
  #   - WebFetch
  #   - WebSearch
  #   - NotebookEdit
  # NOTE: AskUserQuestion is intentionally NOT in allowed_tools.
  # Approval gating is handled by a PreToolUse hook (not can_use_tool)
  # which fires for ALL tool uses regardless of permission settings.

reconnect:
  max_retries: -1
  backoff_base: 1
  backoff_max: 30
