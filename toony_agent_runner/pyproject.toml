[project]
name = "toony-agent-runner"
version = "0.3.0"
description = "Daemon that connects ToonyAgents to the Toony Dev Core backend"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "pyyaml>=6.0",
    "claude-agent-sdk>=0.1.40",
]

[project.scripts]
toony-agent-runner = "toony_agent_runner.main:cli"
